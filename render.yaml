services:
  - type: web
    name: fuelfinder
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: OPINET_CERTKEY
        sync: false
      - key: KAKAO_JAVASCRIPT_KEY
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://fuelfinder-web.onrender.com

  - type: web
    name: fuelfinder-web
    runtime: static
    buildCommand: echo "FuelFinder static frontend ready"
    staticPublishPath: ./public
    autoDeployTrigger: commit
